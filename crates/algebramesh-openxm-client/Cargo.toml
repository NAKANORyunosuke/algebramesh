[package]
name = "algebramesh-openxm-client"
description = "Async OpenXM client: reverse-connect listener, byte-order negotiation and Stack Machine sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
algebramesh-openxm-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true

[features]
# Exposes an in-process fake OpenXM launcher/server for tests of dependent crates.
testing = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
num-bigint.workspace = true
algebramesh-openxm-protocol.workspace = true
algebramesh-openxm-client = { path = ".", features = ["testing"] }
