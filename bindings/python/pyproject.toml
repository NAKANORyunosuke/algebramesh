[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "algebramesh"
description = "Python client for AlgebraMesh, a distributed computer algebra platform."
requires-python = ">=3.9"
license = "MIT"
# The notices of the Rust crates compiled into the extension module are generated
# by cargo-about (about.toml); CI checks that they match Cargo.lock.
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.txt"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.maturin]
python-source = "python"
module-name = "algebramesh._native"
features = ["extension-module"]
