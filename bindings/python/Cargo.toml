[package]
name = "algebramesh-python"
description = "Python binding of the AlgebraMesh client (PyO3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "algebramesh_python"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin when building the extension module.
extension-module = ["pyo3/extension-module"]

[dependencies]
algebramesh-client.workspace = true
algebramesh-core.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
