[package]
name = "algebramesh-server"
description = "Scheduler: public gRPC API, job queue, placement, heartbeats and the SQLite metadata store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
algebramesh-core.workspace = true
algebramesh-rpc.workspace = true
openraft = { version = "0.9.25", features = ["generic-snapshot-data", "serde", "storage-v2"] }
chrono.workspace = true
fs4 = "0.13"
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# Crash points for tests (`fault`, Issue #37); never in a release.
fault-injection = []

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

[lints]
workspace = true

