# An Asir worker that knows the schedulers of compose.raft.yml (scheduler-d joins later).
server = "https://scheduler-a:50051,https://scheduler-b:50051,https://scheduler-c:50051,https://scheduler-d:50051"
ca_file = "/pki/ca.pem"
token_file = "/pki/agent.token"

[[backends]]
kind = "asir"
slots = 1
ox_launch = "/OpenXM/lib/asir/ox_launch"
ox_asir = "/OpenXM/bin/ox_asir"
build = "ghcr.io/nakanoryunosuke/risa-asir-container@sha256:a572b603f710167f708e976900ba883b44c03ecf51378e87a796b7b127bf0aed"
